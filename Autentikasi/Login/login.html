
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | SkillUp</title>

    <!-- CSS LOGIN -->
    <link rel="stylesheet" href="login.css">

    <!-- CSS NOTIFIKASI BERSAMA -->
    <link rel="stylesheet" href="../../Shared/CSS/notification.css">
</head>

<body class="auth-body">

    <main class="auth-page">

        <!-- LOGO SKILLUP -->
        <a href="../../HalamanUtama/Beranda/index.html" class="auth-logo">
            <img
                class="logo-image"
                src="../../Assets/img/logo-skillup.png"
                alt="Logo SkillUp"
            >
            <span>SkillUp</span>
        </a>

        <!-- KARTU LOGIN -->
        <section class="login-card">

            <!-- PILIHAN ROLE -->
            <div class="login-tabs">
                <button
                    type="button"
                    class="login-tab active"
                    data-role="user"
                >
                    Login Peserta
                </button>

                <button
                    type="button"
                    class="login-tab"
                    data-role="admin"
                >
                    Login Admin
                </button>
            </div>

            <!-- JUDUL LOGIN -->
            <div class="auth-heading">
                <h1>Selamat Datang!</h1>

                <p id="loginSubtitle">
                    Masuk untuk melanjutkan proses pemetaan kebutuhan pelatihan.
                </p>
            </div>

            <!-- FORM LOGIN -->
            <form id="loginForm" novalidate>

                <!-- EMAIL -->
                <div class="auth-input-group">
                    <label for="loginEmail">Email Anda</label>

                    <div class="auth-input">
                        <span class="input-icon">✉</span>

                        <input
                            type="email"
                            id="loginEmail"
                            placeholder="Email Anda"
                            autocomplete="email"
                            aria-describedby="loginEmailError"
                        >
                    </div>

                    <small
                        class="field-error"
                        id="loginEmailError"
                    ></small>
                </div>

                <!-- PASSWORD -->
                <div class="auth-input-group">
                    <label for="loginPassword">Password</label>

                    <div class="auth-input password-wrapper">

                        <span class="input-icon">🔒</span>

                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Masukkan password"
                            autocomplete="current-password"
                            aria-describedby="loginPasswordError"
                        >

                        <!-- TOMBOL LIHAT PASSWORD -->
                        <button
                            type="button"
                            class="password-toggle"
                            id="togglePassword"
                            aria-label="Lihat password"
                            aria-pressed="false"
                        >

                            <svg
                                class="eye-open"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>

                            <svg
                                class="eye-closed"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <path d="M3 3l18 18"/>
                                <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/>
                                <path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a16 16 0 0 1-3.1 3.9"/>
                                <path d="M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7c1.1 0 2.1-.2 3-.5"/>
                            </svg>

                        </button>
                    </div>

                    <small
                        class="field-error"
                        id="loginPasswordError"
                    ></small>
                </div>

                <!-- LUPA PASSWORD -->
                <div class="login-options">
                    <a
                        href="../LupaPassword/lupa-password.html"
                        id="forgotPassword"
                    >
                        Lupa Password?
                    </a>
                </div>

                <!-- TOMBOL LOGIN -->
                <button type="submit" class="auth-submit">
                    Login
                </button>

            </form>

            <!-- FOOTER -->
            <p class="auth-footer">
                Belum punya akun?
                <a href="../Daftar/register.html">Daftar</a>
            </p>

        </section>

    </main>

    <!-- JAVASCRIPT NOTIFIKASI -->
    <script src="../../Shared/JS/api-client.js"></script>
    <script src="../../Shared/JS/notification.js"></script>

    <!-- JAVASCRIPT LOGIN -->
    <script src="login.js"></script>

</body>
</html>
